spring.application.name=studymatch

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:studymatch}
spring.datasource.username=${DB_USER:studymatch}
spring.datasource.password=${DB_PASSWORD:studymatch}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.servlet.session.cookie.same-site=lax

# defaults point at Mailpit (docker compose), set the MAIL_* variables to use a real SMTP server
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
studymatch.mail-from=${MAIL_FROM:no-reply@studymatch.com}

studymatch.institution-domain=studymatch.com
studymatch.frontend-url=http://localhost:5173
