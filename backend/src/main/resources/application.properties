spring.application.name=studymatch

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:studymatch}
spring.datasource.username=${DB_USER:studymatch}
spring.datasource.password=${DB_PASSWORD:studymatch}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.servlet.session.cookie.same-site=lax

# defaults point at Mailpit (docker compose), set the MAIL_* variables to use a real SMTP server
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
studymatch.mail-from=${MAIL_FROM:no-reply@studymatch.com}

# uploads, 5 attachments of 10 MB and what goes around them. each kind of file checks its own size, to name the file
spring.servlet.multipart.max-file-size=51MB
spring.servlet.multipart.max-request-size=51MB

# Swagger UI at /swagger-ui.html, sends the CSRF cookie back as a header like the frontend does
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json

studymatch.institution-domain=studymatch.com
studymatch.frontend-url=http://localhost:5173

# generate groups: how long the matching algorithm gets for the whole class
studymatch.matching-seconds=3

# create StudyRoom: Meet links are made on one StudyMatch Google account, empty means links have to be pasted
studymatch.google.client-id=${GOOGLE_CLIENT_ID:}
studymatch.google.client-secret=${GOOGLE_CLIENT_SECRET:}
studymatch.google.refresh-token=${GOOGLE_REFRESH_TOKEN:}
