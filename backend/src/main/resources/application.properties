spring.application.name=studymatch

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:studymatch}
spring.datasource.username=${DB_USER:studymatch}
spring.datasource.password=${DB_PASSWORD:studymatch}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.servlet.session.cookie.same-site=lax

studymatch.institution-domain=studymatch.com
studymatch.frontend-url=http://localhost:5173
