services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-studymatch}
      POSTGRES_USER: ${DB_USER:-studymatch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studymatch}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-studymatch} -d ${DB_NAME:-studymatch}"]
      interval: 5s
      retries: 10

  # fake mail server for local dev: catches every email, read them at http://localhost:8025
  mail:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
