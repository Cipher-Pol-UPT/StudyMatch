# SonarQube Cloud analysis, run by the backend job in .github/workflows/backend.yml after ./mvnw verify
sonar.projectKey=Cipher-Pol-UPT_StudyMatch
sonar.organization=cipher-pol-upt
sonar.projectName=StudyMatch
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test,frontend/tests

# the java rules need the compiled classes, so this has to run after the maven build
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# we don't send frontend coverage, without this every new frontend line counts as uncovered and fails the gate
sonar.coverage.exclusions=frontend/**

# wait for the quality gate and fail the step if it fails
sonar.qualitygate.wait=true
