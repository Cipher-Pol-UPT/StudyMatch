# SonarQube Cloud analysis, run by the sonarqube job in .github/workflows/ci.yml after the backend and frontend jobs
sonar.projectKey=Cipher-Pol-UPT_StudyMatch
sonar.organization=cipher-pol-upt
sonar.projectName=StudyMatch
sonar.sourceEncoding=UTF-8

# scanner 8 analyses the whole repo and ignores sonar.sources, sonar.tests and sonar.test.inclusions, so test code
# counted as production code (no coverage, asserts flagged as bugs). the tests are left out instead, coverage still comes from the reports
sonar.exclusions=backend/src/test/**,frontend/tests/**

# the java rules need the compiled classes, the sonarqube job gets them from the backend job
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# frontend coverage from vitest (npm run test:coverage)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# studymatch-ui is our component library, the pages that use it are what we test.
# it's still analysed for bugs, smells and duplication, it just doesn't count in the coverage
sonar.coverage.exclusions=frontend/src/studymatch-ui/**

# wait for the quality gate and fail the step if it fails
sonar.qualitygate.wait=true
